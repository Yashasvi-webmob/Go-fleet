syntax = "proto3";

package gofleet.v1;
option go_package = "github.com/Yashasvi-webmob/gofleet/gofleet-proto";
import "google/protobuf/timestamp.proto";
import "google/protobuf/empty.proto";

enum JobStatus{
    JOB_STATUS_UNSPECIFIED = 0;
    JOB_STATUS_PENDING = 1;
    JOB_STATUS_RUNNING = 2;
    JOB_STATUS_SUCCESS = 3;
    JOB_STATUS_FAILED = 4;
    JOB_STATUS_TIMEOUT = 5;
    JOB_STATUS_CANCELLED = 6;
    
}

message Job{
    string id= 1;
    JobStatus status= 2;
    string priority= 3;
    string command= 4;
    int32 timeout_seconds= 5;
    int32 retries= 6;
    google.protobuf.Timestamp created_at= 7;
    google.protobuf.Timestamp updated_at= 8;
}

message SubmitJobRequest{
    string priority= 1;
    string command= 2;
    int32 timeout_seconds= 3;
}

message GetJobRequest{
    string id = 1;
}

message CancelJobRequest{
    string id = 1;
}

service JobService{
    rpc CreateJob(SubmitJobRequest) returns (Job);
    rpc GetJob(GetJobRequest) returns (Job);
    rpc CancelJob(CancelJobRequest) returns(google.protobuf.Empty);
}

message WorkerHello{
   string worker_id = 1;
}

message Heartbeat{
   string heartbeat_id =1;
}

message JobResult{
   string job_id=1;
   JobStatus status=2;
   string worker_id =3;

}

message WorkerMessage{
    oneof payload{
        WorkerHello hello =1;
        Heartbeat heartbeat=2;
        JobResult job_result =3;
    }
}

message JobAssignment{
   string job_id =1;
   string command=2;
   int32 timeout_seconds=3;
   string priority=4;
}

message CancelRequest{
    string job_id= 1;
}

message ServerMessage{
    oneof payload{
        JobAssignment assignment =1;
        CancelRequest cancel=2;
    }
}

service WorkerService{
    rpc Connect(stream WorkerMessage) returns (stream ServerMessage);
}